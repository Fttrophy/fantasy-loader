<!DOCTYPE html>
<html>
<head>
<style>
body {
  margin: 0;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

img {
  width: 320px; /* BIGGER LOGO */
  animation: cinematicZoom 3.5s ease-in-out;
}

@keyframes cinematicZoom {
  0% {
    opacity: 0;
    transform: scale(0.6);
  }
  50% {
    opacity: 1;
    transform: scale(1.1);
  }
  100% {
    opacity: 1;
    transform: scale(1);
  }
}
</style>
</head>

<body>
  <img src="https://drive.google.com/thumbnail?id=18h-4jOcqiT5k048UyPq1YBEGPhQ1qpSj&sz=w1000">
  
  <script>
    setTimeout(function(){
      window.location.href = "https://sites.google.com/view/fantasytrophy";
    }, 4000); /* LONGER TIME */
  </script>
</body>
</html>
